[project]
name = "neel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elixir Learner", email = "student@learnelixir.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai>=3.7.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[project.scripts]
neel = "neel:main"

[project.optional-dependencies]
gpu = [
    "accelerate>=1.14.0",
    "nnsight>=0.7.0",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
